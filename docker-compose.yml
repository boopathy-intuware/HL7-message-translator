services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: hl7
      POSTGRES_PASSWORD: hl7
      POSTGRES_DB: hl7_message_translator
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hl7 -d hl7_message_translator"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
